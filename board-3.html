<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>La Boîte Jaune — Menu Board TsT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #12141a;
      --ink-2: #1a1d26;
      --panel: #222632;
      --line: rgba(255, 214, 10, 0.22);
      --yellow: #ffd60a;
      --yellow-hot: #ffe566;
      --yellow-deep: #c9a800;
      --paper: #f4f1e8;
      --muted: #b8b0a0;
      --focus: #ffd60a;
      --font-bubble: "Lilita One", system-ui, sans-serif;
      --font-didone: "Bodoni Moda", "Didot", "Bodoni MT", serif;
      --font-script: "Great Vibes", cursive;
      --font-serif: "Cormorant Garamond", "Palatino Linotype", serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --dwell: 2.8s;
      --enter: 0.85s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-serif);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      pointer-events: none;
      display: block;
      max-width: 100%;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
      width: 100%;
    }

    body[data-view="left"] .board { grid-template-columns: 1fr; }
    body[data-view="right"] .board { grid-template-columns: 1fr; }
    body[data-view="left"] .screen[data-screen="right"],
    body[data-view="right"] .screen[data-screen="left"] { display: none; }

    .screen {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(255, 214, 10, 0.08), transparent 55%),
        linear-gradient(165deg, var(--ink-2), var(--ink) 55%, #0e1015);
      border-right: 1px solid var(--line);
      overflow: hidden;
      padding: 0.9rem 1.6rem 1.1rem;
      gap: 1.1rem;
    }

    .screen[data-screen="right"] { border-right: none; }

    /* Couverture diagonale — confinée au header uniquement */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      isolation: isolate;
      overflow: hidden;
      min-height: 5.6rem;
      padding: 0.75rem 0.2rem 0.95rem;
      flex-shrink: 0;
    }

    .lid {
      position: absolute;
      inset: 0 auto 0 0;
      width: 78%;
      background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-hot) 45%, var(--yellow-deep) 100%);
      clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%);
      z-index: 0;
      pointer-events: none;
    }

    .lid::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -18deg,
        transparent,
        transparent 10px,
        rgba(0, 0, 0, 0.04) 10px,
        rgba(0, 0, 0, 0.04) 12px
      );
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      color: var(--ink);
      max-width: 72%;
    }

    .brand .kicker {
      font-family: var(--font-script);
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: none;
      line-height: 1;
    }

    .brand h1 {
      font-family: var(--font-bubble);
      font-weight: 400;
      font-size: clamp(1.65rem, 2.6vw, 2.45rem);
      line-height: 0.92;
      letter-spacing: 0.01em;
      text-transform: none;
      transform: rotate(-1.5deg);
    }

    .brand h1 .ch {
      display: inline-block;
      will-change: transform;
    }

    .brand h1 .ch.sp { width: 0.28em; }

    .brand p {
      font-family: var(--font-script);
      font-size: 1.15rem;
      font-weight: 400;
      opacity: 0.8;
      margin-top: 0.1rem;
    }

    .lane {
      position: relative;
      z-index: 1;
      font-family: var(--font-script);
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--yellow-hot);
      background: none;
      border: none;
      padding: 0;
      align-self: center;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 0;
      height: 100%;
      padding-top: 0.15rem;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      display: grid;
      gap: 0.75rem;
      align-content: start;
    }

    .slide.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 2;
    }

    .slide-title {
      font-family: var(--font-script);
      font-size: clamp(1.85rem, 2.6vw, 2.45rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--yellow-hot);
      text-transform: none;
      line-height: 1.15;
      margin-bottom: 0.15rem;
    }

    .wave-title .ch,
    .special-sticker .stamp .ch {
      display: inline-block;
      will-change: transform, text-shadow;
    }

    .wave-title .ch.sp,
    .special-sticker .stamp .ch.sp {
      width: 0.28em;
    }

    /* Rail menu — typo ouverte, zéro cadre */
    .rail {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-height: 0;
      overflow: hidden;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.85rem;
      align-items: baseline;
      padding: 0.45rem 0.15rem 0.5rem;
      border-left: none;
      background: transparent;
      border-radius: 0;
      border-bottom: 1px solid transparent;
      position: relative;
    }

    .row.is-focus {
      background: transparent;
      border-bottom-color: rgba(255, 214, 10, 0.55);
    }

    .row.is-focus .name {
      color: var(--yellow-hot);
    }

    .row .meta { min-width: 0; }

    .row .name {
      font-family: var(--font-didone);
      font-size: clamp(1.15rem, 1.7vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.05;
      font-optical-sizing: auto;
    }

    .row .desc {
      margin-top: 0.12rem;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-style: italic;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row .price {
      font-family: var(--font-didone);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: clamp(1.2rem, 1.7vw, 1.55rem);
      color: var(--yellow);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .badges {
      display: inline-flex;
      gap: 0.35rem;
      margin-left: 0.45rem;
      vertical-align: baseline;
    }

    .badge {
      font-family: var(--font-script);
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: var(--yellow-hot);
      background: none;
      padding: 0;
    }

    /* Photo organique — plus de rectangle */
    .strip {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 1rem;
      min-height: 0;
      height: 100%;
      align-items: center;
    }

    .strip-visual {
      position: relative;
      overflow: hidden;
      background: transparent;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      clip-path: polygon(8% 4%, 96% 0%, 100% 88%, 92% 100%, 4% 96%, 0% 12%);
    }

    .strip-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
    }

    .strip-visual .cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1rem 1rem 1.1rem;
      background: linear-gradient(transparent, rgba(10, 12, 16, 0.9));
    }

    .strip-visual .cap .name {
      font-family: var(--font-didone);
      font-size: 1.35rem;
      font-weight: 700;
    }

    .strip-visual .cap .price {
      font-family: var(--font-didone);
      color: var(--yellow);
      font-weight: 800;
      font-size: 1.4rem;
      font-variant-numeric: tabular-nums;
    }

    .strip .rail { align-self: stretch; justify-content: center; }

    /* Special — plein cadre */
    .special {
      position: relative;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      background: transparent;
    }

    .special-photo {
      position: relative;
      min-height: 0;
      overflow: hidden;
      clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%);
    }

    .special-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 55% 40%;
    }

    .special-sticker {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
      padding: 1.05rem 0.35rem 0.35rem;
      background: transparent;
      color: var(--paper);
      border-top: 1px solid rgba(255, 214, 10, 0.35);
    }

    .special-sticker .stamp {
      font-family: var(--font-script);
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: none;
      opacity: 0.95;
      margin-bottom: 0.1rem;
      color: var(--yellow-hot);
    }

    .special-sticker .name {
      font-family: var(--font-bubble);
      font-size: clamp(1.55rem, 2.6vw, 2.35rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.01em;
      text-transform: none;
      color: var(--yellow);
      transform: rotate(-1deg);
    }

    .special-sticker .desc {
      margin-top: 0.35rem;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 500;
      max-width: 36ch;
      color: var(--muted);
    }

    .special-sticker .price {
      font-family: var(--font-didone);
      font-size: clamp(2rem, 3.2vw, 2.85rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
      color: var(--yellow);
    }

    /* Droite — typo desserts + boissons ouvertes */
    .dessert-stack {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding-top: 0.2rem;
    }

    .dessert-stack .row {
      grid-template-columns: 1fr auto;
      padding: 0.55rem 0.15rem;
      border-bottom: 1px solid rgba(255, 214, 10, 0.1);
    }

    .dessert-stack .name {
      font-size: clamp(1.35rem, 2.1vw, 1.75rem);
    }

    .ticket-grid {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin-top: 0.2rem;
    }

    .ticket {
      background: transparent;
      border: none;
      padding: 0.5rem 0.15rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 1rem;
      align-items: baseline;
      border-bottom: 1px solid transparent;
      border-left: none;
    }

    .ticket.is-focus {
      background: transparent;
      border-bottom-color: rgba(255, 214, 10, 0.55);
    }

    .ticket.is-focus .name {
      color: var(--yellow-hot);
    }

    .ticket .name {
      font-family: var(--font-didone);
      font-size: clamp(1.1rem, 1.6vw, 1.4rem);
      font-weight: 700;
      line-height: 1.1;
      grid-column: 1;
    }

    .ticket .desc {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 500;
      grid-column: 1;
    }

    .ticket .price {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      margin-top: 0;
      font-family: var(--font-didone);
      font-weight: 800;
      color: var(--yellow);
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.15rem, 1.6vw, 1.45rem);
    }

    .foot {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.35rem;
      border-top: 1px solid var(--line);
    }

    .dots {
      display: flex;
      gap: 0.35rem;
    }

    .dots span {
      width: 0.45rem;
      height: 0.45rem;
      background: rgba(255, 214, 10, 0.25);
    }

    .dots span.on { background: var(--yellow); }

    .loyalty {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .loyalty .qr {
      width: 52px;
      height: 52px;
      background:
        linear-gradient(90deg, #fff 2px, transparent 2px) 0 0 / 8px 8px,
        linear-gradient(#fff 2px, transparent 2px) 0 0 / 8px 8px,
        #111;
      border: 2px solid var(--yellow);
      flex-shrink: 0;
    }

    .loyalty p {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      font-style: italic;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.25;
      max-width: 18ch;
    }

    .loyalty strong {
      display: block;
      font-family: var(--font-script);
      font-style: normal;
      font-weight: 400;
      color: var(--paper);
      font-size: 1.2rem;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 0.65rem;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--yellow);
      padding: 0.35rem 0.7rem;
      opacity: 0.92;
      transition: opacity 0.6s ease;
    }

    .hint.hide { opacity: 0; pointer-events: none; }

    .tst-mark {
      position: fixed;
      right: 0.7rem;
      bottom: 0.55rem;
      z-index: 50;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244, 241, 232, 0.45);
    }

    .tst-mark span { color: var(--yellow); }

    /* —— Motion (CSS-first) —— */
    body:not(.has-rm) .slide.is-active.is-playing .row,
    body:not(.has-rm) .slide.is-active.is-playing .ticket {
      animation: slideIn 0.7s var(--ease-out-expo) both;
    }

    body:not(.has-rm) .slide.is-active.is-playing .row:nth-child(1),
    body:not(.has-rm) .slide.is-active.is-playing .ticket:nth-child(1) { animation-delay: 0.05s; }
    body:not(.has-rm) .slide.is-active.is-playing .row:nth-child(2),
    body:not(.has-rm) .slide.is-active.is-playing .ticket:nth-child(2) { animation-delay: 0.12s; }
    body:not(.has-rm) .slide.is-active.is-playing .row:nth-child(3),
    body:not(.has-rm) .slide.is-active.is-playing .ticket:nth-child(3) { animation-delay: 0.19s; }
    body:not(.has-rm) .slide.is-active.is-playing .row:nth-child(4),
    body:not(.has-rm) .slide.is-active.is-playing .ticket:nth-child(4) { animation-delay: 0.26s; }
    body:not(.has-rm) .slide.is-active.is-playing .row:nth-child(5),
    body:not(.has-rm) .slide.is-active.is-playing .ticket:nth-child(5) { animation-delay: 0.33s; }
    body:not(.has-rm) .slide.is-active.is-playing .row:nth-child(6) { animation-delay: 0.4s; }

    body:not(.has-rm) .brand h1 .ch {
      animation: none;
    }

    /* Sous-titres : Stagger vague + glow Enter, puis Float en Loop */
    body:not(.has-rm) .slide.is-active.is-playing .wave-title .ch,
    body:not(.has-rm) .slide.special-slide.is-active.is-playing .special-sticker .stamp .ch {
      animation:
        letterWaveGlow 0.95s var(--ease-out-expo) both,
        subtitleWave 2.6s ease-in-out 0.95s infinite;
      animation-delay:
        calc(var(--i, 0) * 0.048s),
        calc(0.95s + var(--i, 0) * 0.07s);
    }

    body:not(.has-rm) .slide.special-slide.is-active.is-playing .special-sticker .stamp .ch {
      animation-delay:
        calc(0.55s + var(--i, 0) * 0.048s),
        calc(1.5s + var(--i, 0) * 0.07s);
    }

    body:not(.has-rm) .slide.is-active.is-playing .strip-visual {
      animation: scaleIn 0.9s var(--ease-out-expo) both;
    }

    body:not(.has-rm) .slide.is-active.is-playing .strip-visual img {
      animation: ken 8s ease-in-out both;
    }

    body:not(.has-rm) .slide.special-slide.is-active.is-playing .special-photo {
      animation: revealWipe 1.05s var(--ease-out-expo) both;
    }

    body:not(.has-rm) .slide.special-slide.is-active.is-playing .special-photo img {
      animation: scaleInPhoto 1.2s var(--ease-out-expo) both, ken 9s ease-in-out 1.1s both;
    }

    body:not(.has-rm) .slide.special-slide.is-active.is-playing .special-sticker {
      animation: stickerUp 0.75s var(--ease-out-expo) 0.55s both;
    }

    body:not(.has-rm) .row.is-focus,
    body:not(.has-rm) .ticket.is-focus {
      animation: focusPulse 2.8s ease-in-out;
    }

    /* Crossfade between slides handled via opacity transition */
    .slide {
      transition: opacity 0.55s var(--ease-out-expo), visibility 0.55s;
    }

    @keyframes titleIdleFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(1.2deg); }
    }

    @keyframes letterWaveGlow {
      0% {
        opacity: 0.4;
        transform: translateY(16px);
        text-shadow: 0 0 0 transparent;
      }
      55% {
        opacity: 1;
        transform: translateY(-7px);
        text-shadow:
          0 0 10px rgba(255, 214, 10, 0.95),
          0 0 22px rgba(255, 214, 10, 0.55),
          0 0 36px rgba(255, 230, 120, 0.35);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        text-shadow: 0 0 6px rgba(255, 214, 10, 0.28);
      }
    }

    @keyframes subtitleWave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes scaleInPhoto {
      from { opacity: 0.35; transform: scale(1.12); }
      to { opacity: 1; transform: scale(1.04); }
    }

    @keyframes revealWipe {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes stickerUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ken {
      0% { transform: scale(1.04) translate(0, 0); }
      100% { transform: scale(1.12) translate(-1.5%, -1%); }
    }

    @keyframes focusPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    @media (max-width: 1100px) {
      .board { grid-template-columns: 1fr; }
      .screen[data-screen="right"] { border-top: 1px solid var(--line); }
      .strip { grid-template-columns: 1fr; }
      html, body { overflow: auto; }
      .board { height: auto; min-height: 100%; }
      .screen { min-height: 100vh; }
      .stage { min-height: 58vh; }
    }
  </style>
</head>
<body>
  <div class="board" id="board">
    <section class="screen" data-screen="left" aria-label="Écran combos et ailes">
      <header class="topbar">
        <div class="lid" aria-hidden="true"></div>
        <div class="brand">
          <div class="kicker">Montréal</div>
          <h1>La Boîte Jaune</h1>
          <p>Best wings · boîte ouverte</p>
        </div>
        <div class="lane">Combos / Ailes</div>
      </header>
      <div class="stage" data-stage="left"></div>
      <footer class="foot">
        <div class="dots" data-dots="left"></div>
        <div class="loyalty">
          <div class="qr" aria-hidden="true"></div>
          <p><strong>Scan fidélité</strong>QR démo · non lié</p>
        </div>
      </footer>
    </section>

    <section class="screen" data-screen="right" aria-label="Écran desserts et boissons">
      <header class="topbar">
        <div class="lid" aria-hidden="true"></div>
        <div class="brand">
          <div class="kicker">Montréal</div>
          <h1>La Boîte Jaune</h1>
          <p>Finir fort · boire froid</p>
        </div>
        <div class="lane">Desserts / Boissons</div>
      </header>
      <div class="stage" data-stage="right"></div>
      <footer class="foot">
        <div class="dots" data-dots="right"></div>
        <div class="loyalty">
          <div class="qr" aria-hidden="true"></div>
          <p><strong>Scan fidélité</strong>QR démo · non lié</p>
        </div>
      </footer>
    </section>
  </div>

  <div class="hint" id="hint">F11 plein écran · Special « La Boîte du Chef » à gauche</div>
  <div class="tst-mark">Propriété <span>TsT</span></div>

  <script>
    const LEFT_SLIDES = [
      {
        type: "special",
        duration: 12000,
        name: "La Boîte du Chef",
        desc: "Ailes glaze maison + mac 3 fromages",
        price: "34,95 $",
        image: "assets/ailes-jaune.png",
        stamp: "Special du jour",
      },
      {
        title: "Combos signature",
        layout: "strip",
        duration: 10000,
        hero: {
          name: "Combo #2",
          desc: "8 ailes + plantains",
          price: "25,35 $",
          image: "assets/combo-plantains.png",
        },
        items: [
          { name: "Combo #3", desc: "8 ailes + mac n cheese", price: "29,25 $", image: "assets/combo-mac.png", badges: ["Hit"] },
          { name: "Combo #6", desc: "12 ailes + mac", price: "35,75 $", badges: ["Le + demandé"] },
          { name: "Combo #5", desc: "12 ailes + plantains", price: "31,85 $" },
          { name: "Combo #1", desc: "8 ailes + frites", price: "26,65 $" },
        ],
      },
      {
        title: "Ailes & à-côtés",
        layout: "strip",
        duration: 10000,
        hero: {
          name: "Ailes sésame",
          desc: "Chili + citron",
          price: "31,49 $",
          image: "assets/ailes-sesame.png",
        },
        items: [
          { name: "Ailes signature", desc: "Glaze maison", price: "31,49 $", image: "assets/ailes-jaune.png", badges: ["Classique"] },
          { name: "Mac n Cheese", desc: "Grand · 3 fromages", price: "12,00 $", image: "assets/mac-fromage.png" },
          { name: "Poutine maison", desc: "Frites · fromage · sauce", price: "11,99 $", image: "assets/poutine.png", badges: ["Nouveau"] },
          { name: "Ailes 20 mcx", desc: "Idéal à partager", price: "49,99 $" },
        ],
      },
      {
        title: "Liste combos",
        duration: 9000,
        items: [
          { name: "Combo #1", desc: "8 ailes + frites", price: "26,65 $" },
          { name: "Combo #4", desc: "12 ailes + frites", price: "33,15 $" },
          { name: "Combo #5", desc: "12 ailes + plantains", price: "31,85 $" },
          { name: "Combo #7", desc: "20 ailes + frites", price: "53,95 $" },
          { name: "SPECIAL Combo #1", desc: "5 ailes + frites", price: "18,85 $", badges: ["Special"] },
        ],
      },
    ];

    const RIGHT_SLIDES = [
      {
        title: "Desserts",
        layout: "desserts",
        duration: 9000,
        items: [
          { name: "Brownie chocolat", desc: "Fondant maison", price: "5,49 $", badges: ["Le + demandé"] },
          { name: "Gâteau fromage", desc: "Tranche", price: "6,49 $" },
          { name: "Cookies double chip", desc: "2 pièces", price: "4,99 $" },
          { name: "Soft serve", desc: "Vanille / chocolat", price: "3,99 $" },
          { name: "Milkshake maison", desc: "Choco / fraise / vanille", price: "6,99 $", badges: ["Nouveau"] },
        ],
      },
      {
        title: "Boissons froides",
        layout: "tickets",
        duration: 9000,
        items: [
          { name: "Coca-Cola / Diet", desc: "Canette 355 ml", price: "2,99 $" },
          { name: "Sprite / Fanta", desc: "Canette 355 ml", price: "2,99 $" },
          { name: "Jus tropical", desc: "Mangue ou ananas", price: "3,99 $", badges: ["Populaire"] },
          { name: "Thé glacé maison", desc: "Citron / pêche", price: "3,49 $" },
          { name: "Eau / Perrier", desc: "Bouteille", price: "2,49 $" },
          { name: "Milkshake", desc: "Maison", price: "6,99 $" },
        ],
      },
      {
        title: "Boissons chaudes",
        layout: "tickets",
        duration: 8000,
        items: [
          { name: "Café filtre", desc: "Régulier ou décaf", price: "2,75 $" },
          { name: "Chocolat chaud", desc: "Crémeux", price: "3,50 $" },
          { name: "Thé / tisane", desc: "Sélection du jour", price: "2,75 $" },
        ],
      },
    ];

    const DEFAULT_MS = 9000;
    const FOCUS_MS = 2800;
    const ENTER_MS = 900;
    const params = new URLSearchParams(location.search);
    const view = params.get("screen");
    if (view === "left" || view === "right") document.body.dataset.view = view;
    if (params.has("rm")) document.body.classList.add("has-rm");

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* Lettres toujours visibles par défaut (safe si anim échoue) */
    function splitChars(text) {
      return [...String(text)].map((ch, i) => {
        if (ch === " ") return `<span class="ch sp" style="--i:${i}">&nbsp;</span>`;
        return `<span class="ch" style="--i:${i}">${esc(ch)}</span>`;
      }).join("");
    }

    function waveTitle(text) {
      return `<div class="slide-title wave-title">${splitChars(text)}</div>`;
    }

    function badges(list) {
      if (!list || !list.length) return "";
      return `<span class="badges">${list.map((b) => `<span class="badge">${esc(b)}</span>`).join("")}</span>`;
    }

    function rowHtml(item) {
      return `<li class="row">
        <div class="meta">
          <div class="name">${esc(item.name)}${badges(item.badges)}</div>
          <div class="desc">${esc(item.desc || "")}</div>
        </div>
        <div class="price">${esc(item.price)}</div>
      </li>`;
    }

    function ticketHtml(item) {
      return `<article class="ticket">
        <div class="name">${esc(item.name)}${badges(item.badges)}</div>
        <div class="desc">${esc(item.desc || "")}</div>
        <div class="price">${esc(item.price)}</div>
      </article>`;
    }

    function renderSlide(slide, index) {
      if (slide.type === "special") {
        return `<div class="slide special-slide" data-index="${index}" data-type="special">
          <div class="special">
            <div class="special-photo">
              <img src="${esc(slide.image)}" alt="${esc(slide.name)}" />
            </div>
            <div class="special-sticker">
              <div>
                <div class="stamp">${splitChars(slide.stamp || "Special")}</div>
                <div class="name">${esc(slide.name)}</div>
                <div class="desc">${esc(slide.desc)}</div>
              </div>
              <div class="price">${esc(slide.price)}</div>
            </div>
          </div>
        </div>`;
      }

      if (slide.layout === "strip" && slide.hero) {
        return `<div class="slide" data-index="${index}">
          ${waveTitle(slide.title)}
          <div class="strip">
            <div class="strip-visual">
              <img src="${esc(slide.hero.image)}" alt="${esc(slide.hero.name)}" />
              <div class="cap">
                <div class="name">${esc(slide.hero.name)}</div>
                <div class="price">${esc(slide.hero.price)}</div>
              </div>
            </div>
            <ul class="rail">${slide.items.map(rowHtml).join("")}</ul>
          </div>
        </div>`;
      }

      if (slide.layout === "desserts") {
        return `<div class="slide" data-index="${index}">
          ${waveTitle(slide.title)}
          <ul class="rail dessert-stack">${slide.items.map(rowHtml).join("")}</ul>
        </div>`;
      }

      if (slide.layout === "tickets") {
        return `<div class="slide" data-index="${index}">
          ${waveTitle(slide.title)}
          <div class="ticket-grid">${slide.items.map(ticketHtml).join("")}</div>
        </div>`;
      }

      return `<div class="slide" data-index="${index}">
        ${waveTitle(slide.title)}
        <ul class="rail">${slide.items.map(rowHtml).join("")}</ul>
      </div>`;
    }

    function bootScreen(side, slides) {
      const stage = document.querySelector(`[data-stage="${side}"]`);
      const dotsEl = document.querySelector(`[data-dots="${side}"]`);
      if (!stage || !slides.length) return;

      stage.innerHTML = slides.map(renderSlide).join("");
      dotsEl.innerHTML = slides.map((_, i) => `<span data-i="${i}"></span>`).join("");

      const nodes = [...stage.querySelectorAll(".slide")];
      let idx = 0;
      let focusTimer = null;
      let slideTimer = null;

      function clearFocus() {
        if (focusTimer) {
          clearInterval(focusTimer);
          focusTimer = null;
        }
        stage.querySelectorAll(".is-focus").forEach((el) => el.classList.remove("is-focus"));
      }

      function retrigger(el) {
        el.classList.remove("is-playing");
        void el.offsetWidth;
        el.classList.add("is-playing");
      }

      function startFocus(slideEl) {
        clearFocus();
        const targets = [...slideEl.querySelectorAll(".row, .ticket")];
        if (!targets.length || document.body.classList.contains("has-rm")) return;
        let i = 0;
        const mark = () => {
          targets.forEach((t) => t.classList.remove("is-focus"));
          const t = targets[i % targets.length];
          t.classList.remove("is-focus");
          void t.offsetWidth;
          t.classList.add("is-focus");
          i += 1;
        };
        mark();
        focusTimer = setInterval(mark, FOCUS_MS);
      }

      function show(i) {
        clearFocus();
        nodes.forEach((n) => {
          n.classList.remove("is-active", "is-playing");
        });
        idx = i % nodes.length;
        const active = nodes[idx];
        active.classList.add("is-active");
        retrigger(active);
        dotsEl.querySelectorAll("span").forEach((d, di) => d.classList.toggle("on", di === idx));

        const slide = slides[idx];
        const ms = slide.duration || DEFAULT_MS;
        window.setTimeout(() => startFocus(active), ENTER_MS);

        if (slideTimer) clearTimeout(slideTimer);
        slideTimer = setTimeout(() => show(idx + 1), ms);
      }

      show(0);
    }

    if (!view || view === "left") bootScreen("left", LEFT_SLIDES);
    if (!view || view === "right") bootScreen("right", RIGHT_SLIDES);

    const hint = document.getElementById("hint");
    setTimeout(() => hint && hint.classList.add("hide"), 5000);

    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && ["s", "S", "p", "P", "u", "U"].includes(e.key)) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
